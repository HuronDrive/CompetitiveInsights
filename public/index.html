<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Competitive Insights - Audit Tool</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 1.5em;
            color: #2c3e50;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 30px;
            background: #667eea;
            border-radius: 2px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #34495e;
            font-weight: 600;
        }

        .input-wrapper {
            position: relative;
        }

        textarea, input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        textarea:focus, input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .help-text {
            font-size: 0.9em;
            color: #7f8c8d;
            margin-top: 5px;
        }

        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .checkbox-item:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .checkbox-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            margin-right: 10px;
            cursor: pointer;
        }

        .checkbox-item label {
            margin: 0;
            cursor: pointer;
            font-weight: normal;
        }

        .btn {
            padding: 15px 40px;
            font-size: 1.1em;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            width: 100%;
            justify-content: center;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-download {
            background: #3498db;
            color: white;
            margin-right: 10px;
        }

        .btn-download:hover {
            background: #2980b9;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results {
            display: none;
        }

        .results.active {
            display: block;
        }

        .metric-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .metric-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .metric-label {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 5px;
        }

        .metric-value {
            font-size: 2em;
            font-weight: bold;
        }

        .insights-list {
            list-style: none;
        }

        .insights-list li {
            padding: 15px;
            background: #f8f9ff;
            border-left: 4px solid #667eea;
            margin-bottom: 10px;
            border-radius: 4px;
        }

        .recommendations-list {
            list-style: none;
        }

        .recommendations-list li {
            padding: 15px;
            background: #fff8e1;
            border-left: 4px solid #ffa726;
            margin-bottom: 10px;
            border-radius: 4px;
        }

        .recommendations-list li::before {
            content: '💡 ';
            margin-right: 8px;
        }

        .domain-results {
            margin-top: 30px;
        }

        .domain-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .domain-card h3 {
            color: #2c3e50;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e0e0e0;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .stat-item {
            background: white;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #e0e0e0;
        }

        .stat-label {
            font-size: 0.85em;
            color: #7f8c8d;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.3em;
            font-weight: 600;
            color: #2c3e50;
        }

        .error {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #c62828;
            margin-bottom: 20px;
        }

        .download-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2em;
            }

            .metric-grid, .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Competitive Insights</h1>
            <p>Analyze your competitors with SimilarWeb, Ahrefs, and SEMRush data</p>
        </div>

        <div class="card">
            <h2 class="section-title">Configure Your Audit</h2>

            <form id="auditForm">
                <div class="form-group">
                    <label for="domains">Domains to Analyze</label>
                    <textarea
                        id="domains"
                        placeholder="Enter one domain per line, e.g.:&#10;example.com&#10;competitor1.com&#10;competitor2.com"
                        required
                    ></textarea>
                    <div class="help-text">Enter one domain per line (without http:// or https://)</div>
                </div>

                <div class="form-group">
                    <label>Data Sources</label>
                    <div class="checkbox-group">
                        <div class="checkbox-item">
                            <input type="checkbox" id="includeTraffic" checked>
                            <label for="includeTraffic">📊 SimilarWeb Traffic</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="includeSEO" checked>
                            <label for="includeSEO">🔗 Ahrefs SEO</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="includeSEMRush" checked>
                            <label for="includeSEMRush">📈 SEMRush Intelligence</label>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" id="submitBtn">
                    <span id="btnText">Run Competitive Audit</span>
                </button>
            </form>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Analyzing domains... This may take a moment.</p>
        </div>

        <div class="results" id="results">
            <div class="card">
                <h2 class="section-title">Analysis Summary</h2>

                <div class="metric-grid" id="metricGrid">
                    <!-- Metrics will be inserted here -->
                </div>

                <div id="insights">
                    <h3 style="margin-bottom: 15px; color: #2c3e50;">Key Insights</h3>
                    <ul class="insights-list" id="insightsList">
                        <!-- Insights will be inserted here -->
                    </ul>
                </div>

                <div id="recommendations" style="margin-top: 30px;">
                    <h3 style="margin-bottom: 15px; color: #2c3e50;">Recommendations</h3>
                    <ul class="recommendations-list" id="recommendationsList">
                        <!-- Recommendations will be inserted here -->
                    </ul>
                </div>

                <div class="download-buttons">
                    <button class="btn btn-download" onclick="downloadReport('html')">Download HTML</button>
                    <button class="btn btn-download" onclick="downloadReport('markdown')">Download Markdown</button>
                    <button class="btn btn-download" onclick="downloadReport('json')">Download JSON</button>
                </div>
            </div>

            <div class="domain-results" id="domainResults">
                <!-- Domain-specific results will be inserted here -->
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
